[package]
name = "racelab"
version = "0.4.0"
description = "RaceLab telemetry desktop application"
authors = ["Taha Gürvardar"]
edition = "2021"

[lib]
name = "racelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tauri = { version = "2", features = [] }
